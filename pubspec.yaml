name: just_deflate
description: Pure Dart DEFLATE (RFC 1951) compression and decompression with the zlib (RFC 1950) and gzip (RFC 1952) formats. No dependencies; runs on native, web and Wasm.
version: 0.1.0
homepage: https://github.com/just-unknown-dev/just-deflate
repository: https://github.com/just-unknown-dev/just-deflate
issue_tracker: https://github.com/just-unknown-dev/just-deflate/issues

topics:
  - compression
  - deflate
  - zlib
  - gzip

environment:
  sdk: ^3.11.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
